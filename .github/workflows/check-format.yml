name: Check formatting

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      pull-requests: read
    with:
      filter-group: format

  check-qml:
    needs: changes
    if: needs.changes.outputs.format-qml == 'true'
    runs-on: ubuntu-latest
    # Lowercase literal, not ${{ github.repository_owner }}: Docker rejects an
    # uppercase registry reference, container.image is resolved before any step
    # could lowercase it, and GitHub expressions have no toLower(). A fork edits
    # this one string (and nothing else) to point at its own namespace. See T29.
    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/clague/shell-arch-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check QML format
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmlformat --version
          # SearchIndex.qml is generated; the generator owns its bytes and --check verifies them.
          python3 scripts/gen-nexus-search-index.py --check
          for file in (string match -v 'build/*' **.qml)
            if test "$file" = "modules/nexus/SearchIndex.qml"
              continue
            end
            /usr/lib/qt6/bin/qmlformat $file | diff -u $file - || exit 1
          end
          python3 scripts/qml-lint-conventions.py

  check-cpp:
    needs: changes
    if: needs.changes.outputs.format-cpp == 'true'
    runs-on: ubuntu-latest
    # Lowercase literal, not ${{ github.repository_owner }}: Docker rejects an
    # uppercase registry reference, container.image is resolved before any step
    # could lowercase it, and GitHub expressions have no toLower(). A fork edits
    # this one string (and nothing else) to point at its own namespace. See T29.
    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/clague/shell-arch-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Check C++ format
        shell: fish {0}
        run: |
          clang-format --version
          find plugin extras -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror

  format-check:
    if: always()
    needs:
      - changes
      - check-qml
      - check-cpp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify formatting results
        uses: ./.github/actions/verify-checks
        with:
          needs: ${{ toJSON(needs) }}
          checks: |
            {
              "check-qml": "format-qml",
              "check-cpp": "format-cpp"
            }
