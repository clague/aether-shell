name: Lint code

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      pull-requests: read
    with:
      filter-group: build

  lint-qml:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    # Lowercase literal, not ${{ github.repository_owner }}: Docker rejects an
    # uppercase registry reference, container.image is resolved before any step
    # could lowercase it, and GitHub expressions have no toLower(). A fork edits
    # this one string (and nothing else) to point at its own namespace. See T29.
    container:
      image: ghcr.io/yoavr1/shell-arch-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          # Set version and git rev for CI build so we don't call git
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clazy -DVERSION= -DGIT_REVISION=
          cmake --build build

      # Proves the QML gate still rejects Info-level output, which is what this job enforces
      # with `test -z "$lint_out"`. It did not, once: qmllint exits 0 when every diagnostic it
      # printed is Info-level, so hybrid/tools/qml-lint.sh reported a clean tree while this job
      # failed on the same files. See trap T48. Placed after Build because the gate needs
      # build/qml for its import paths -- putting it with the no-build checkers failed here
      # with "build/qml missing", which is this comment's reason for existing.
      - name: Self-test the QML gate
        run: ./hybrid/tools/qml-lint.sh --self-test

      - name: Lint QML
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmllint --version

          # Generate tooling
          touch .qmlls.ini
          QT_QPA_PLATFORM=offscreen QML2_IMPORT_PATH="$PWD/build/qml:$QML2_IMPORT_PATH" timeout 2 qs -p .

          # Construct linter args
          set -l build_dir (grep -oP "(?<=buildDir=\")(.*)(?=\")" .qmlls.ini)
          set -l import_paths (grep -oP "(?<=importPaths=\")(.*)(?=\")" .qmlls.ini | string split :)
          set -l args -I $build_dir
          for path in $import_paths
            set -a args -I $path
          end
          set -l qml_files (string match -vr 'build/.*' **.qml)

          # Lint
          set -l lint_out (mktemp)
          /usr/lib/qt6/bin/qmllint $args $qml_files 2> $lint_out

          set -l singleton_pattern 'Type [A-Z][a-zA-Z0-9]* not declared as singleton in qmldir but using pragma Singleton'
          set -l post_reload_hook_pattern 'PostReloadHook was not found\. Did you add all imports and dependencies\?'
          sed -i -E "/(($singleton_pattern)|($post_reload_hook_pattern)) \[import\]/d" $lint_out

          cat $lint_out

          ! test -s $lint_out

  lint-cpp:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    # Lowercase literal, not ${{ github.repository_owner }}: Docker rejects an
    # uppercase registry reference, container.image is resolved before any step
    # could lowercase it, and GitHub expressions have no toLower(). A fork edits
    # this one string (and nothing else) to point at its own namespace. See T29.
    container:
      image: ghcr.io/yoavr1/shell-arch-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # The checkout is owned by a different uid than the container's root, so git refuses
      # every command with "detected dubious ownership". The checkers now fail loudly on
      # that rather than reporting an empty tree as clean, but they still need it to work.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Need no build, so they run first and fail in seconds rather than after a configure.
      - name: Check for dead signals
        run: ./hybrid/tools/dead-signals.py

      - name: Check shell command construction
        run: ./hybrid/tools/shell-safety.py

      - name: Check for unreferenced QML
        run: ./hybrid/tools/dead-qml.py

      - name: Check for config keys nothing reads
        run: ./hybrid/tools/dead-config.py

      - name: Configure        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DVERSION= -DGIT_REVISION=

      # protoc has not run after a bare configure, so the six generated .pb.h do not exist
      # and every QuickShare translation unit fails to parse with "'wire_format.pb.h' file
      # not found" -- taking a cascade of spurious findings with it. Upstream's lint job has
      # no build step because upstream's tree has no protobuf.
      - name: Build (generates the protobuf headers clang-tidy needs)
        run: cmake --build build

      - name: Lint C++
        run: |
          clang-tidy --version
          run-clang-tidy -p build -quiet -j "$(nproc)" -warnings-as-errors='*' \
            -source-filter='^(?!.*/build/).*\.cpp$'

  lint-check:
    if: always()
    needs:
      - changes
      - lint-qml
      - lint-cpp
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify lint results
        uses: $/.github/actions/verify-checks
        with:
          needs: ${{ toJSON(needs) }}
          checks: |
            {
              "lint-qml": "lint",
              "lint-cpp": "lint"
            }
